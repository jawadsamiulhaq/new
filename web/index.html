<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>BurChips × Bake Dukan | Order Online · DHA Phase 8, Lahore</title>
    <meta
      name="description"
      content="Burgers, grilled chicken, wraps and Bake Dukan desserts in DHA Phase 8, Lahore. Order online for delivery or take-away — track your order live."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The server replaces __ORIGIN__ with the site address and __CANONICAL__ with this page's address. -->
    <link rel="canonical" href="__CANONICAL__" />

    <!-- Link previews (WhatsApp, Facebook, X) -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="BurChips × Bake Dukan" />
    <meta property="og:title" content="BurChips × Bake Dukan — Order Online" />
    <meta property="og:description" content="Burgers, grilled chicken, wraps and desserts. Delivery & take-away in DHA Phase 8, Lahore." />
    <meta property="og:url" content="__CANONICAL__" />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_PK" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Search engines: restaurant details -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "BurChips × Bake Dukan",
        "url": "__ORIGIN__/",
        "image": "__ORIGIN__/og-image.png",
        "telephone": "+92-344-1858989",
        "servesCuisine": ["Burgers", "Fast Food", "Grilled Chicken", "Desserts"],
        "priceRange": "Rs 100 – Rs 900",
        "acceptsReservations": false,
        "hasMenu": "__ORIGIN__/menu",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "185/1 D Block, Commercial Broadway, DHA Phase 8 (back side of DHA Business Hub)",
          "addressLocality": "Lahore",
          "addressRegion": "Punjab",
          "addressCountry": "PK"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to order online, or call us at 0344-1858989.</noscript>
    <!-- Static header shown instantly while the app loads; React replaces it. -->
    <div id="root">
      <header class="sticky top-0 z-30 border-b border-line bg-charcoal/95">
        <div class="mx-auto flex h-16 max-w-6xl items-center px-4">
          <span class="flex flex-col leading-none">
            <span class="font-display text-2xl font-extrabold tracking-tight">Bur<span class="text-mustard">Chips</span></span>
            <span class="mt-0.5 text-[0.65rem] font-semibold tracking-[0.18em] text-muted uppercase">× <span class="text-dukan">Bake Dukan</span></span>
          </span>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
